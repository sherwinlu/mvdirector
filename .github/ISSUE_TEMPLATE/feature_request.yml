name: Feature request
description: Something the pipeline should do, or do differently.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do that is hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to change?
  - type: textarea
    id: context
    attributes:
      label: Your setup
      description: Model provider, ComfyUI models, and whether you run locally, in Docker or on RunPod.
