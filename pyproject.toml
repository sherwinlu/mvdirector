[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mvdirector"
version = "0.5.0"
description = "Manifest-driven pipeline that plans, generates, quality-checks and assembles lip-synced music videos with ComfyUI."
readme = "README.md"
license = { file = "LICENSE" }
classifiers = ["License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)"]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
    "pyyaml>=6.0,<7",
    "numpy>=1.26,<3",
    "librosa>=0.10,<2",
    "soundfile>=0.12,<1",
    "httpx>=0.27,<1",
    "typer>=0.12,<1",
    "pillow>=10.0,<14",
]

[project.optional-dependencies]
# Anthropic Claude backend SDK (install when using llm.provider: anthropic).
anthropic = ["anthropic>=0.40,<3"]
# Commercially permissive face detection, face framing and lip-sync checks (Apache-2.0).
qc = ["mediapipe>=0.10,<2"]
# Neural lip-sync scoring via ByteDance LatentSync's stable_syncnet.pt (OpenRAIL++) + MediaPipe.
syncnet = ["mediapipe>=0.10,<2", "torch>=2.1,<3"]
# Optional non-commercial research face-embedding identity check (buffalo_l weights).
insightface = ["insightface>=2.1,<3", "onnxruntime>=1.17,<2"]
# Word-level lyric alignment.
align = ["faster-whisper>=1.0,<2"]
# Stem separation for audio-only ingestion (MIT-licensed Demucs).
stems = ["demucs>=4.0,<5"]
# Review UI.
ui = ["streamlit>=1.33,<2"]
dev = ["anthropic>=0.40,<3", "pytest>=8.0,<10", "ruff>=0.5,<1", "mypy>=1.10,<3"]

[project.scripts]
mvd = "mvdirector.cli:app"

[project.urls]
Homepage = "https://github.com/sherwinlu/mvdirector"
Repository = "https://github.com/sherwinlu/mvdirector"
Issues = "https://github.com/sherwinlu/mvdirector/issues"
Changelog = "https://github.com/sherwinlu/mvdirector/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/mvdirector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"  # keep until the (str, Enum) models move to StrEnum
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
    "B008", # typer's API puts Option()/Argument() calls in argument defaults
    "B905", # zip() over deliberately offset sequences (pairwise iteration)
]

[tool.mypy]
files = ["src/mvdirector"]
ignore_missing_imports = true
