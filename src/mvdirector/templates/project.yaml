# mvdirector project configuration.
# Every value below is the default; delete what you do not need to change.
# Connection strings (comfy.base_url, comfy.headers, llm.base_url) may reference
# allowed environment variables (MVD_*, COMFY_*, or names listed in
# MVD_ALLOWED_ENV_VARS) via ${NAME} or ${NAME:-fallback}.

title: My Song
mode: standard        # standard (single-track music video) | mix (30-90+ min continuous mix)
seed: 1234            # base seed; every attempt's seed is derived from it
auto_tune: true       # auto-adjust default transcription, pacing, and lip-sync values per track

inputs:
  mix: inputs/mix.wav            # full mix (also the final soundtrack)
  vocals: inputs/vocals.wav      # vocal stem (drives lip-sync; generated by `mvd prepare` if missing)
  drums: null                    # optional drum stem, e.g. inputs/drums.wav (cleaner beat grid)
  stems_dir: inputs/stems        # optional folder for extracted Suno/DAW stem packs (.zip or .wav/.mp3)
  lyrics: inputs/lyrics.txt
  style: inputs/style.md
  word_timestamps: null          # optional JSON [{word, start, end}], skips transcription
  tracklist: null                # optional cue sheet / WeaveShift tracklist (.json, .yaml, .cue, .txt, .csv) for mode: mix
  exclusions: []                 # optional list of things never to show in any shot

prepare:
  stem_model: htdemucs           # Demucs model for `mvd prepare` stem separation
  stem_device: auto              # auto | cpu | cuda | mps
  whisper_model: small           # faster-whisper model size (use large-v3-turbo for non-English)
  whisper_language: null         # optional ISO code (e.g. en, es, ja, ko); null = auto-detect
  whisper_multilingual: false    # true = detect language per segment (for code-switching songs)
  whisper_stall_timeout_seconds: 600  # abort a stalled transcription (first segment: 3x); 0 = off

video:
  width: 1280
  height: 720
  draft_width: null              # optional width for --draft runs (defaults to half-res)
  draft_height: null             # optional height for --draft runs
  size_multiple: 1               # grid your workflow renders on (LTX: 64); sizes snap to it, keeping the aspect
  fps: 24
  max_clip_seconds: 8.0          # longest clip your video workflow handles well
  min_clip_seconds: 2.5
  broll_min_clip_seconds: null   # optional shorter min clip for high-intensity non-vocal B-roll drops
  handle_seconds: 0.25           # extra on each side of a shot, trimmed at assembly
  frame_multiple: 8              # frame rule multiple*n+offset (LTX: 8/1, Wan: 4/1, MiniMax: 1/0)
  frame_offset: 1
  beats_per_bar: 4
  cut_mode: bars                 # bars (musical grid) | phrases (vocal/section phrases, e.g. MiniMax H3)
  dynamic_pacing: false          # true = cut faster on high-intensity bars and snap to sections
  snap_sections: auto            # auto (snap when section tags name >1 singer) | always | never
  lipsync_min_vocal_fraction: 0.25
  lipsync_audio_source: vocals   # vocals | mix
  motion_single_take: true       # enforce single-take and framing continuity in motion prompts
  motion_no_subtitles: true      # prevent video models from rendering karaoke subtitles (not used in mix mode)
  motion_no_music: true          # tell audio-video models not to hallucinate background music
  motion_include_lyrics: false   # set true for prompt-driven lip-sync models (e.g. Seedance)
  assembly_intercut: false       # true = beat-lock intercut high-intensity non-lipsync runs at assembly
  assembly_intercut_min_intensity: 0.7  # minimum section intensity (0-1) to trigger assembly_intercut
  assembly_intercut_anticipation_frames: 1  # frames before beat for assembly_intercut cuts (0-3)

mix:                             # used when mode: mix (30-90+ minute continuous mixes)
  default_segment_seconds: 240.0 # fallback 4-min chapters when inputs.tracklist is null
  visual_source: clips           # clips (t2i + i2v loops) | stills (t2i hero stills + camera motion)
  clips_per_segment: 3           # 2-3 loopable visual units generated per track chapter
  clip_seconds: 6.0              # target loop clip duration in seconds (4.0..8.0)
  xfade_seconds: 1.0             # crossfade overlap inside each chapter's seamless loop cycle
  chapter_fade_seconds: 0.75     # fade-in / fade-out duration at chapter boundaries
  beat_pulse: 0.35               # BPM/downbeat-synced subtle visual pulse strength (0..1)
  chapters_sidecar: true         # write YouTube-compatible <output>.chapters.txt during assemble
  hud:
    enabled: true
    show_title: true
    watermark: ""
    show_spectrum: true
    position: bottom_left        # bottom_left | bottom_right | top_left | top_right

comfy:
  base_url: ${COMFY_URL:-http://127.0.0.1:8188}   # local, home LAN/Tailscale (http://192.168.x.x:8188), or cloud HTTPS
  headers: {}                    # e.g. {Authorization: "Bearer ${COMFY_TOKEN}"}
  request_timeout: 60
  job_timeout: 1800
  poll_interval: 3
  max_concurrency: 1             # shots rendered in parallel per wave (>1 for serverless / multi-pod)
  workflows_dir: workflows
  reference_notation: prose      # prose ('first/second reference image') | tags ('@image1', '@video1')
  workflows:                     # starter examples; point these at bindings for any model you prefer
    t2i: qwen_t2i.bindings.json            # reference portrait and b-roll stills
    still: qwen_edit_still.bindings.json   # singer stills from the reference portrait
    lipsync: ltx_lipsync.bindings.json     # image + audio -> video
    i2v: ltx_i2v.bindings.json             # image -> video

llm:
  # One model does every text task: planning, vision checks and prompt rewrites.
  enabled: true                  # false = rule-based planning, no vision checks, no prompt rewrites
  provider: ollama               # ollama (local or remote) | anthropic | openai | gemini | openai_compatible
  model: gemma3:12b              # any model name your provider offers; accepts images for vision checks
                                 #   must be set explicitly for every provider except ollama
  base_url: null                 # server address (or set MVD_LLM_URL); required for openai_compatible
  api_key_env: null              # env var holding the key; defaults: ANTHROPIC_API_KEY,
                                 #   OPENAI_API_KEY, GEMINI_API_KEY (ollama needs none). Custom
                                 #   names must be MVD_* or listed in MVD_ALLOWED_ENV_VARS.
  max_tokens: 8000               # response limit; raise it if replies are cut off
  shots_per_request: 20          # shots directed per call; use fewer (5-10) for small models
  timeout_seconds: 600           # a local model can be slow when the GPU is busy
  json_mode: auto                # auto | off | object | schema
  context_tokens: null           # context window to request (ollama default 16384)
  stream: false                  # true = SSE streaming for openai/openai_compatible (avoids proxy timeouts)
  # Examples:
  #   provider: anthropic         model: <a Claude model>
  #   provider: openai            model: <an OpenAI model>
  #   provider: gemini            model: <a Gemini model>
  #   provider: openai_compatible base_url: http://localhost:1234/v1   (LM Studio)

planning:
  video_style: lipsync           # lipsync | narrative (characters, no lip-sync) | visual (100% b-roll, no characters)
  vocals: auto                   # auto | solo (lock singing to primary protagonist) | multi (duet/ensemble)
  wardrobe_monotonic: true       # a costume change is one-way (a cape taken off stays off)
  allow_multicut_shots: false    # allow the planner to emit multi-angle montage cuts (allow_cuts)
  max_lipsync_share: 0.45        # cap on screen time the singer sings to camera: 0.7 performance,
                                 #   0.45 hybrid, 0.2 narrative; the rest becomes cutaways (null = no cap)
  audio_listen: auto             # auto | always | never: run a 1-call Gemini MP3 listen when planner is text-only
  max_props: 3                   # max recurring hero props in the visual bible (0-30)
  opening_seconds: 8.0           # seconds from song start treated as the opening hook window (0 disables)
  pin_character_details: true    # pin character invariants into generated still & motion prompts
  # audio_llm:                   # optional audio-capable LLM for native MP3 listen (defaults to qc.llm if Gemini)
  #   provider: gemini
  #   model: gemini-3.8-flash

reference:
  layout: row                    # row (1x4) | grid (2x2) | columns (headshots + front/back body)
  background: white              # white | grey (neutral grey avoids clipping glowing outfits)
  width: null                    # sheet size; defaults depend on layout
  height: null
  candidates: 4
  video_candidates: 2
  closeup_face_panel: false      # true = use face-detail panel on close_up stills for single-ref workflows
  panel_inset: 0.012             # trimmed from each panel edge to drop dividers and labels

plates:
  candidates: 3                  # candidate images per set

props:
  candidates: 3                  # candidate two-angle sheets per hero prop

qc:
  pass_score: 0.70
  opening_threshold_margin: 0.0  # optional extra QC margin added for opening-hook shots (0.0-0.3)
  vision_enabled: true
  # llm:                         # optional separate LLM for Vision QC (e.g. fast/cheap Gemini while planning with Claude)
  #   provider: gemini
  #   model: gemini-3.8-flash
  # vision_spec: 0.71            # shorthand hard min for both qc.image and qc.video (calibrated for gemini-3.8-flash)
  # vision_artifacts: 0.72
  # vision_character: 0.71
  face_backend: mediapipe        # mediapipe (Apache-2.0, commercial-safe) | insightface (non-commercial research)
  lipsync_backend: mediapipe     # mediapipe (Apache-2.0, CPU) | stable_syncnet (LatentSync OpenRAIL++ + MediaPipe)
  on_missing_dependency: fail    # fail (recommended) | skip
  # image: and video: thresholds are listed in the README; calibrate them on your own clips.

retry:
  max_attempts: 4
  opening_extra_attempts: 2
  keep_still_on_video_fail: true
  strategies: [new_seed, rewrite_prompt, adjust_params]
  max_generations_per_run: 300
  adjust_params:
    still: {steps: 40}
    video: {steps: 40}

review:
  mode: light                    # light | strict (override with --review-mode)
  closeup_rate: 1.0
  other_rate: 0.25
  include_retried: true
  include_near_threshold: true
  near_threshold_margin: 0.05
